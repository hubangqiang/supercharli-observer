<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超级查理观测台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <button id="navToggleBtn" class="ghost-btn">导航</button>
        <div>
          <h1>超级查理观测台</h1>
          <p id="metaLine">加载中...</p>
        </div>
      </div>
      <button id="refreshBtn">刷新</button>
    </header>

    <main id="appRoot" class="app-layout">
      <aside id="sidebar" class="sidebar">
        <button class="nav-item active" data-page="overview">运行总览</button>
        <button class="nav-item" data-page="sessions">会话动态</button>
        <button class="nav-item" data-page="memory">记忆系统</button>
        <button class="nav-item" data-page="learning">学习系统</button>
        <button class="nav-item" data-page="skills">Skill 资产库</button>
        <button class="nav-item" data-page="audit">系统审计</button>
      </aside>

      <section class="content">
        <section id="alert" class="alert hidden"></section>

        <section id="page-overview" class="page active">
          <h2>运行总览</h2>
          <div id="overviewKpis" class="cards"></div>
          <div class="layout cols-2">
            <article class="panel">
              <h3>路由统计</h3>
              <table>
                <thead><tr><th>路由</th><th>次数</th></tr></thead>
                <tbody id="overviewRouteRows"></tbody>
              </table>
            </article>
            <article class="panel">
              <h3>最近会话</h3>
              <table>
                <thead><tr><th>会话</th><th>轮次</th><th>最近活跃</th></tr></thead>
                <tbody id="overviewSessionRows"></tbody>
              </table>
            </article>
          </div>
        </section>

        <section id="page-sessions" class="page">
          <h2>会话动态</h2>
          <div class="session-layout">
            <article class="panel online-panel">
              <h3>在线会话（10分钟内）</h3>
              <div id="onlineSessionsList" class="session-list"></div>
            </article>
            <article class="panel timeline-panel">
              <h3 id="timelineTitle">会话时间线</h3>
              <div id="timelineContainer" class="timeline"></div>
            </article>
          </div>
        </section>

        <section id="page-memory" class="page">
          <h2>记忆系统</h2>
          <div id="memoryKpis" class="cards"></div>
          <article class="panel">
            <h3>最近 L2 模式</h3>
            <table>
              <thead><tr><th>键名</th><th>摘要</th><th>强度</th><th>更新时间</th></tr></thead>
              <tbody id="memoryL2Rows"></tbody>
            </table>
          </article>
        </section>

        <section id="page-learning" class="page">
          <h2>学习系统</h2>
          <div id="learningKpis" class="cards"></div>
          <article class="panel">
            <h3>最近学习事件</h3>
            <table>
              <thead><tr><th>时间</th><th>结果</th><th>模式</th><th>路由</th></tr></thead>
              <tbody id="learningRows"></tbody>
            </table>
          </article>
        </section>

        <section id="page-skills" class="page">
          <h2>Skill 资产库</h2>
          <div id="skillsKpis" class="cards"></div>
          <article class="panel">
            <h3>管理中 Skill（表格）</h3>
            <table>
              <thead>
                <tr>
                  <th>Skill ID</th><th>标题</th><th>类型</th><th>生命周期</th><th>质量</th><th>使用</th><th>成功/失败</th><th>最近更新</th><th>来源</th>
                </tr>
              </thead>
              <tbody id="skillsAssetRows"></tbody>
            </table>
          </article>
        </section>

        <section id="page-audit" class="page">
          <h2>系统审计</h2>
          <article class="panel">
            <h3>Skill 过程事件</h3>
            <table>
              <thead><tr><th>时间</th><th>会话/Trace</th><th>阶段</th><th>路由/模型</th><th>摘要</th></tr></thead>
              <tbody id="auditProcessRows"></tbody>
            </table>
          </article>
          <article class="panel">
            <h3>Skill 生命周期迁移</h3>
            <table>
              <thead><tr><th>时间</th><th>Skill</th><th>迁移</th><th>原因</th></tr></thead>
              <tbody id="auditLifecycleRows"></tbody>
            </table>
          </article>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
