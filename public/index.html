<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超级查理观测台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>超级查理观测台</h1>
        <p id="metaLine">加载中...</p>
      </div>
      <button id="refreshBtn">刷新</button>
    </header>

    <main>
      <section id="alert" class="alert hidden"></section>

      <section class="cards" id="kpis"></section>

      <section class="layout">
        <article class="panel">
          <h2>记忆系统</h2>
          <div id="memoryLevels" class="cards"></div>
          <h3>最近 L2 模式</h3>
          <table>
            <thead>
              <tr><th>键名</th><th>摘要</th><th>强度</th><th>更新时间</th></tr>
            </thead>
            <tbody id="l2Rows"></tbody>
          </table>
        </article>

        <article class="panel">
          <h2>学习与成长</h2>
          <div id="learningOverview" class="cards"></div>
          <h3>最近学习事件</h3>
          <table>
            <thead>
              <tr><th>时间</th><th>结果</th><th>模式</th><th>路由</th></tr>
            </thead>
            <tbody id="learningRows"></tbody>
          </table>
          <h3>学习候选（模型提炼）</h3>
          <table>
            <thead>
              <tr><th>时间</th><th>模式</th><th>摘要</th><th>策略</th></tr>
            </thead>
            <tbody id="candidateRows"></tbody>
          </table>
        </article>
      </section>

      <section class="layout">
        <article class="panel">
          <h2>注入技能观测</h2>
          <div id="skillOverview" class="cards"></div>
          <h3>当前 Skill 目录</h3>
          <table>
            <thead>
              <tr><th>Skill 标识</th><th>出现次数</th><th>最近出现</th><th>预览</th></tr>
            </thead>
            <tbody id="skillCatalogRows"></tbody>
          </table>
          <h3>Skill 注入历史</h3>
          <table>
            <thead>
              <tr><th>时间</th><th>会话</th><th>路由/模型</th><th>技能集合</th></tr>
            </thead>
            <tbody id="skillHistoryRows"></tbody>
          </table>
          <h3>管理中 Skill（方法资产）</h3>
          <table>
            <thead>
              <tr><th>Skill 标识</th><th>标题</th><th>使用次数</th><th>更新时间</th></tr>
            </thead>
            <tbody id="managedSkillRows"></tbody>
          </table>
          <h3>管理 Skill 使用历史</h3>
          <table>
            <thead>
              <tr><th>时间</th><th>会话</th><th>路由/模型</th><th>Skill 标识</th></tr>
            </thead>
            <tbody id="managedSkillHistoryRows"></tbody>
          </table>
        </article>

        <article class="panel">
          <h2>运行态</h2>
          <div id="runtimeOverview" class="cards"></div>
          <h3>会话分布</h3>
          <table>
            <thead>
              <tr><th>会话</th><th>轮次数</th><th>最近活跃</th></tr>
            </thead>
            <tbody id="sessionRows"></tbody>
          </table>
        </article>

        <article class="panel">
          <h2>路由统计</h2>
          <table>
            <thead>
              <tr><th>路由</th><th>次数</th></tr>
            </thead>
            <tbody id="routeRows"></tbody>
          </table>
          <h3>自我模型</h3>
          <pre id="selfModelBox"></pre>
        </article>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
